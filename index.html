<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <title>Jurnal Warung Ghoil Bawazier</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Judul Utama-->
     <header>
        <h1>Boulaith.co</h1>
        <p>@az.nazzura</p>
     </header>

     <hr>

     <!-- Konten Utama Review Warung-->
      <main>
        <h2>Warung Biduni Ism</h2>

        <!-- Tambahan Foto Kafe -->
         <div class="foto-container">
            <img src="IMG_7343.jpg" alt="Foto Warung" class="foto-warung">
         </div>
        <p><strong>Kota:</strong> Ghoil Bawazier</p>
        <p class="rating-container">
    Rating: 
    <span class="bintang" data-value="1">★</span>
    <span class="bintang" data-value="2">★</span>
    <span class="bintang" data-value="3">★</span>
    <span class="bintang" data-value="4">★</span>
    <span class="bintang" data-value="5">★</span>
    <span id="teks-rating" style="font-size: 14px; margin-left: 8px; color: #705849;">(5/5)</span>
</p>
        <!-- Bagian Tag Fasilitas-->
        <h3>Fasilitas</h3>
<div id="fasilitas-container">
    <label class="tag-fasilitas">
        <input type="checkbox" checked data-rate="5/5"> 
        <span>AC</span>
        <small class="badge-rate">5/5 ⭐</small>
    </label>

    <label class="tag-fasilitas">
        <input type="checkbox" checked data-rate="4/5"> 
        <span>Makan berat</span>
        <small class="badge-rate">4/5 ⭐</small>
    </label>

    <label class="tag-fasilitas">
        <input type="checkbox" checked data-rate="5/5"> 
        <span>Makan ringan</span>
        <small class="badge-rate">5/5 ⭐</small>
    </label>

    <label class="tag-fasilitas">
        <input type="checkbox" checked data-rate="4.5/5"> 
        <span>Porsi besar</span>
        <small class="badge-rate">4.5/5 ⭐</small>
    </label>

    <label class="tag-fasilitas">
        <input type="checkbox" checked data-rate="3/5"> 
        <span>Lesehan</span>
        <small class="badge-rate">3/5 ⭐</small>
    </label>

    <label class="tag-fasilitas">
        <input type="checkbox" checked data-rate="5/5"> 
        <span>Meja kursi</span>
        <small class="badge-rate">5/5 ⭐</small>
    </label>

    <label class="tag-fasilitas">
        <input type="checkbox"> 
        <span>Outdoor</span>
        <small class="badge-rate">-</small>
    </label>
</div>

         <!-- Bagian Input Ulasan -->
          <h3>Ulasan:</h3>
          <textarea id="input-ulasan" placeholder="Tulis review-nya di sini..."></textarea>
          <!-- Tambahkan baris di bawah ini: -->
           <p id="info-karakter" style="font-size: 14px; color: #a08a7d; text-align: right; margin-top: 5px;">0 karakter</p>

          <!-- Informasi Tambahan -->
           <h3>Informasi:</h3>
           <div class="info-container">
            <div class="info-item">
                <span class="info-label">Harga</span>
                <span class="info-value">500-3000</span>
            </div>
            <div class="info-item">
                 <span class="info-label">Jam Buka</span>
                 <span class="info-value">06.00-11.00 & 18.00-11.00</span>
                 </div>
                </div>
      </main>

      <!-- Navigasi Bawah -->
       <footer>
        <hr>
        <button>Beranda</button>
        <button>Notes</button>
       </footer>
 <script src="script.js"></script>
</body>
</html>
